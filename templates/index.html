<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToCAP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>ToCAP</h1>
    <form method="POST">
        <textarea
                name="cookies_textbox"
                placeholder="Enter your cookies"
                required
        ></textarea><br><br>
        <button type="submit">Send cookie</button>
    </form>
    <br>
    {% if result.status == "VALID" %}
        <div>
            YES<br>
            {{ result.username }}
        </div>
    {% else %}
        <div>
            NO<br>
            {{ result.status }}<br>
            {{ result.message }}
        </div>
    {% endif %}
</div>
</body>
</html>
